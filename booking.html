<!DOCTYPE html>
<html>
<head>
<title>Pilih Jadwal</title>
<link rel="stylesheet" href="../style.css">
<style>
  .jadwal-container {
    display: flex;
    flex-direction: column;
    gap: 15px;
    margin: 20px 0;
  }
  
  .jadwal-card {
    border: 1px solid #ddd;
    border-radius: 8px;
    padding: 15px;
    background: #f9f9f9;
    cursor: pointer;
    transition: all 0.3s ease;
  }
  
  .jadwal-card:hover {
    border-color: #007bff;
    box-shadow: 0 2px 8px rgba(0,123,255,0.2);
    background: #f0f7ff;
  }
  
  .jadwal-card.selected {
    border-color: #28a745;
    background: #e8f5e9;
    box-shadow: 0 2px 8px rgba(40,167,69,0.2);
  }
  
  .rute-header {
    font-size: 18px;
    font-weight: bold;
    color: #333;
    margin-bottom: 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  
  .durasi {
    font-size: 12px;
    color: #666;
    padding: 4px 8px;
    background: #e0e0e0;
    border-radius: 4px;
  }
  
  .jadwal-details {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 15px;
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px solid #ddd;
  }
  
  .detail-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }
  
  .detail-label {
    font-size: 12px;
    color: #999;
    text-transform: uppercase;
    margin-bottom: 5px;
  }
  
  .detail-value {
    font-size: 14px;
    font-weight: bold;
    color: #333;
  }
  
  .harga {
    color: #28a745;
    font-size: 16px;
  }
  
  .harga-kapasitas {
    display: flex;
    flex-direction: column;
    gap: 10px;
    align-items: center;
    text-align: center;
  }
  
  .kapasitas {
    color: #007bff;
    font-size: 14px;
  }
  
  .kapasitas-penuh {
    color: #dc3545;
  }
  
  .jam-jadwal {
    display: flex;
    justify-content: center;
    align-items: center;
    margin: 8px 0;
    font-size: 14px;
  }
  
  .jam {
    font-weight: bold;
    color: #007bff;
  }
  
  .panah {
    margin: 0 10px;
    color: #999;
  }
  
  .selected-info {
    margin-top: 20px;
    padding: 15px;
    background: #e8f5e9;
    border-left: 4px solid #28a745;
    border-radius: 4px;
  }
  
  .selected-info p {
    margin: 5px 0;
    color: #333;
  }
  
  .btn-lanjut {
    background: #28a745;
    color: white;
    padding: 12px 20px;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    font-size: 16px;
    margin-top: 15px;
    width: 100%;
  }
  
  .btn-lanjut:hover {
    background: #218838;
  }
  
  .btn-lanjut:disabled {
    background: #ccc;
    cursor: not-allowed;
  }
</style>
</head>
<body onload="tampilJadwal()">

<div class="card" style="display: flex; flex-direction: column; align-items: center; margin: 0 auto; width: 100%; max-width: 600px; padding: 20px 0;">
  <div style="margin-bottom: 20px; width: 100%; text-align: left;">
    <button onclick="goHome()" style="background: #6c757d; color: white; padding: 10px 15px; border: none; border-radius: 4px; cursor: pointer;">← Kembali</button>
  </div>
  
  <h2 style="text-align: center;">Pilih Jadwal</h2>
  <div id="rute-info" style="background: #e3f2fd; padding: 15px; border-radius: 4px; margin-bottom: 20px; text-align: center; width: 100%; max-width: 500px;">
    <p id="rute-text" style="margin: 5px 0;"><strong>Asal → Tujuan</strong></p>
    <p id="tanggal-text" style="margin: 5px 0; font-size: 14px; color: #666;"><strong>Tanggal:</strong> -</p>
  </div>

  <div class="jadwal-container" id="jadwal" style="width: 100%; max-width: 500px; margin: 0 auto;"></div>

  <div id="selected-info" class="selected-info" style="display: none;">
    <p><strong>Jadwal Terpilih:</strong></p>
    <p>Waktu: <span id="selected-time">-</span></p>
    <p>Harga: Rp <span id="selected-price">-</span></p>
    <p>Kursi Tersedia: <span id="selected-seats">-</span></p>
  </div>

  <button class="btn-lanjut" id="btn-lanjut" onclick="lanjutKeKursi()" disabled>Lanjut Pilih Kursi</button>
</div>

<script src="../app.js"></script>
</body>
</html>
