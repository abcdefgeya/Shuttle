<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - AppKita</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body>

<div class="navbar">
    <div class="logo">APPKITA</div>
</div>

<div class="auth-wrapper">
    <div class="card">
        <h2>LOGIN</h2>

        <input type="text" id="loginUser" placeholder="No. HP atau Email">
        
        <input type="password" id="loginPass" placeholder="Password">

        <button class="btn-main" onclick="login()">MASUK SEKARANG</button>

        <div style="margin-top: 20px; color: #777; font-size: 14px;">
            <p>Belum punya akun?</p>
            <a href="register.html" class="btn-outline">DAFTAR AKUN</a>
        </div>
    </div>
</div>

<script src="../app.js"></script>
</body>
</html>
