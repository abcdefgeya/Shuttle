<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inbox</title>
    <link rel="stylesheet" href="../style.css">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px 0;
        }

        .navbar {
            background: rgba(0,0,0,0.3);
            padding: 15px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(10px);
        }

        .navbar-left {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .back-btn {
            background: none;
            border: none;
            color: white;
            font-size: 24px;
            cursor: pointer;
            transition: transform 0.3s;
        }

        .back-btn:hover {
            transform: scale(1.1);
        }

        .navbar-title {
            color: white;
            font-size: 20px;
            font-weight: bold;
        }

        .inbox-container {
            display: flex;
            justify-content: center;
            padding: 40px 20px;
        }

        .inbox-card {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 600px;
        }

        .inbox-card h2 {
            color: #667eea;
            margin-top: 0;
            margin-bottom: 25px;
            text-align: center;
        }

        .inbox-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 20px;
        }

        .inbox-item {
            border: 2px solid #ddd;
            border-radius: 10px;
            padding: 20px;
            background: #f8f9fa;
            cursor: pointer;
            transition: all 0.3s;
        }

        .inbox-item:hover {
            border-color: #667eea;
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.2);
            transform: translateY(-2px);
        }

        .inbox-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 12px;
        }

        .inbox-rute {
            font-size: 18px;
            font-weight: bold;
            color: #333;
        }

        .inbox-status {
            background: #28a745;
            color: white;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }

        .inbox-details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 12px;
            padding-bottom: 12px;
            border-bottom: 1px solid #ddd;
        }

        .inbox-detail {
            font-size: 13px;
        }

        .inbox-detail-label {
            color: #999;
            margin-bottom: 3px;
        }

        .inbox-detail-value {
            color: #333;
            font-weight: 600;
        }

        .inbox-action {
            display: flex;
            gap: 10px;
        }

        .btn-tiket {
            flex: 1;
            background: #667eea;
            color: white;
            padding: 10px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
            font-size: 14px;
        }

        .btn-tiket:hover {
            background: #764ba2;
            transform: translateY(-2px);
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }

        .empty-icon {
            font-size: 80px;
            margin-bottom: 15px;
        }

        @media (max-width: 600px) {
            .inbox-card {
                padding: 20px;
            }

            .inbox-details {
                grid-template-columns: 1fr;
            }

            .inbox-action {
                flex-direction: column;
            }
        }
    </style>
</head>
<body onload="loadInbox()">

<!-- NAVBAR -->
<div class="navbar">
    <div class="navbar-left">
        <button class="back-btn" onclick="kembaliKeMenu()">←</button>
        <div class="navbar-title">Inbox</div>
    </div>
</div>

<!-- INBOX CONTAINER -->
<div class="inbox-container">
    <div class="inbox-card">
        <h2>📬 Inbox Aktif</h2>
        <div class="inbox-list" id="inbox-list">
            <!-- Inbox akan di-load di sini -->
        </div>
    </div>
</div>

<script src="../app.js"></script>
<script>
    function loadInbox() {
        const pesanan = JSON.parse(localStorage.getItem('pesanan')) || [];
        const now = new Date();
        const inboxList = document.getElementById('inbox-list');

        // Filter pesanan yang sudah dibayar dan dalam 90 hari terakhir
        const aktif = pesanan.filter(p => {
            if (p.status !== 'paid') return false;
            
            const tanggalPesan = new Date(p.waktu_pesan);
            const selisihHari = (now - tanggalPesan) / (1000 * 60 * 60 * 24);
            return selisihHari < 90;
        });

        if (aktif.length === 0) {
            inboxList.innerHTML = `
                <div class="empty-state">
                    <div class="empty-icon">📭</div>
                </div>
            `;
            return;
        }

        inboxList.innerHTML = aktif.map((p, index) => `
            <div class="inbox-item" onclick="lihatTiketInbox(${pesanan.indexOf(p)})">
                <div class="inbox-header">
                    <div class="inbox-rute">${p.dari} → ${p.tujuan}</div>
                    <div class="inbox-status">✓ AKTIF</div>
                </div>
                <div class="inbox-details">
                    <div class="inbox-detail">
                        <div class="inbox-detail-label">📅 Tanggal</div>
                        <div class="inbox-detail-value">${p.tanggal}</div>
                    </div>
                    <div class="inbox-detail">
                        <div class="inbox-detail-label">⏰ Jam</div>
                        <div class="inbox-detail-value">${p.jam_berangkat}</div>
                    </div>
                    <div class="inbox-detail">
                        <div class="inbox-detail-label">💺 Kursi</div>
                        <div class="inbox-detail-value">${p.kursi}</div>
                    </div>
                    <div class="inbox-detail">
                        <div class="inbox-detail-label">🎫 Kode</div>
                        <div class="inbox-detail-value">${p.kode_pesanan}</div>
                    </div>
                </div>
                <div class="inbox-action">
                    <button class="btn-tiket" onclick="lihatTiketInbox(${pesanan.indexOf(p)}); event.stopPropagation();">👁️ Lihat Tiket</button>
                </div>
            </div>
        `).join('');
    }

    function lihatTiketInbox(index) {
        const pesanan = JSON.parse(localStorage.getItem('pesanan')) || [];
        localStorage.setItem('tiketAktif', JSON.stringify(pesanan[index]));
        window.location.href = "tiket-view.html";
    }

    function kembaliKeMenu() {
        window.location.href = "index.html";
    }
</script>
</body>
</html>
