<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cek Reservasi</title>
    <link rel="stylesheet" href="../style.css">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px 0;
        }

        .navbar {
            background: rgba(0,0,0,0.3);
            padding: 15px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(10px);
        }

        .navbar-left {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .back-btn {
            background: none;
            border: none;
            color: white;
            font-size: 24px;
            cursor: pointer;
            transition: transform 0.3s;
        }

        .back-btn:hover {
            transform: scale(1.1);
        }

        .navbar-title {
            color: white;
            font-size: 20px;
            font-weight: bold;
        }

        .reservasi-container {
            display: flex;
            justify-content: center;
            padding: 40px 20px;
        }

        .reservasi-card {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 600px;
        }

        .reservasi-card h2 {
            color: #667eea;
            margin-top: 0;
            margin-bottom: 25px;
            text-align: center;
        }

        .reservasi-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 20px;
        }

        .reservasi-item {
            border: 2px solid #ddd;
            border-radius: 10px;
            padding: 20px;
            background: #f8f9fa;
            cursor: pointer;
            transition: all 0.3s;
        }

        .reservasi-item:hover {
            border-color: #667eea;
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.2);
            transform: translateY(-2px);
        }

        .reservasi-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 12px;
        }

        .reservasi-rute {
            font-size: 18px;
            font-weight: bold;
            color: #333;
        }

        .reservasi-status {
            background: #28a745;
            color: white;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }

        .reservasi-details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 12px;
            padding-bottom: 12px;
            border-bottom: 1px solid #ddd;
        }

        .reservasi-detail {
            font-size: 13px;
        }

        .reservasi-detail-label {
            color: #999;
            margin-bottom: 3px;
        }

        .reservasi-detail-value {
            color: #333;
            font-weight: 600;
        }

        .reservasi-action {
            display: flex;
            gap: 10px;
        }

        .btn-lihat {
            flex: 1;
            background: #667eea;
            color: white;
            padding: 10px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
            font-size: 14px;
        }

        .btn-lihat:hover {
            background: #764ba2;
            transform: translateY(-2px);
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #999;
        }

        .empty-icon {
            font-size: 60px;
            margin-bottom: 20px;
        }

        .empty-title {
            font-size: 18px;
            font-weight: bold;
            color: #333;
            margin-bottom: 10px;
        }

        @media (max-width: 600px) {
            .reservasi-card {
                padding: 20px;
            }

            .reservasi-details {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body onload="loadReservasi()">

<!-- NAVBAR -->
<div class="navbar">
    <div class="navbar-left">
        <button class="back-btn" onclick="kembaliKeMenu()">←</button>
        <div class="navbar-title">Cek Reservasi</div>
    </div>
</div>

<!-- RESERVASI CONTAINER -->
<div class="reservasi-container">
    <div class="reservasi-card">
        <h2>🎫 Daftar Reservasi (Sudah Dibayar)</h2>
        <div class="reservasi-list" id="reservasi-list">
            <!-- Reservasi akan di-load di sini -->
        </div>
    </div>
</div>

<script src="../app.js"></script>
<script>
    function loadReservasi() {
        const pesanan = JSON.parse(localStorage.getItem('pesanan')) || [];
        const pesananBayar = pesanan.filter(p => p.status === 'paid');
        const reservasiList = document.getElementById('reservasi-list');

        if (pesananBayar.length === 0) {
            reservasiList.innerHTML = `
                <div class="empty-state">
                    <div class="empty-icon">🎫</div>
                    <div class="empty-title">Belum Ada Reservasi</div>
                    <p>Pesan tiket dan selesaikan pembayaran untuk melihat kode reservasi Anda.</p>
                </div>
            `;
            return;
        }

        reservasiList.innerHTML = pesananBayar.map((p, index) => `
            <div class="reservasi-item" onclick="lihatTiketReservasi(${index})">
                <div class="reservasi-header">
                    <div class="reservasi-rute">${p.dari} → ${p.tujuan}</div>
                    <div class="reservasi-status">✓ AKTIF</div>
                </div>
                <div class="reservasi-details">
                    <div class="reservasi-detail">
                        <div class="reservasi-detail-label">🎫 Kode Reservasi</div>
                        <div class="reservasi-detail-value" style="font-family: monospace; letter-spacing: 1px;">${p.kode_pesanan}</div>
                    </div>
                    <div class="reservasi-detail">
                        <div class="reservasi-detail-label">📅 Tanggal</div>
                        <div class="reservasi-detail-value">${p.tanggal}</div>
                    </div>
                    <div class="reservasi-detail">
                        <div class="reservasi-detail-label">⏰ Jam</div>
                        <div class="reservasi-detail-value">${p.jam_berangkat}</div>
                    </div>
                    <div class="reservasi-detail">
                        <div class="reservasi-detail-label">💺 Kursi</div>
                        <div class="reservasi-detail-value">${p.kursi}</div>
                    </div>
                </div>
                <div class="reservasi-action">
                    <button class="btn-lihat" onclick="lihatTiketReservasi(${index}); event.stopPropagation();">👁️ Lihat Tiket</button>
                </div>
            </div>
        `).join('');
    }

    function lihatTiketReservasi(index) {
        const pesanan = JSON.parse(localStorage.getItem('pesanan')) || [];
        const pesananBayar = pesanan.filter(p => p.status === 'paid');
        localStorage.setItem('tiketAktif', JSON.stringify(pesananBayar[index]));
        window.location.href = "tiket-view.html";
    }

    function kembaliKeMenu() {
        window.location.href = "index.html";
    }
</script>
</body>
</html>
