<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pesanan Saya</title>
    <link rel="stylesheet" href="../style.css">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px 0;
        }

        .navbar {
            background: rgba(0,0,0,0.3);
            padding: 15px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(10px);
        }

        .navbar-left {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .back-btn {
            background: none;
            border: none;
            color: white;
            font-size: 24px;
            cursor: pointer;
            transition: transform 0.3s;
        }

        .back-btn:hover {
            transform: scale(1.1);
        }

        .navbar-title {
            color: white;
            font-size: 20px;
            font-weight: bold;
        }

        .pesanan-container {
            display: flex;
            justify-content: center;
            padding: 40px 20px;
        }

        .pesanan-card {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 600px;
        }

        .pesanan-card h2 {
            color: #667eea;
            margin-top: 0;
            margin-bottom: 25px;
            text-align: center;
        }

        .pesanan-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 20px;
        }

        .pesanan-item {
            border: 2px solid #ddd;
            border-radius: 10px;
            padding: 20px;
            background: #f8f9fa;
            cursor: pointer;
            transition: all 0.3s;
        }

        .pesanan-item:hover {
            border-color: #667eea;
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.2);
            transform: translateY(-2px);
        }

        .pesanan-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 12px;
        }

        .pesanan-rute {
            font-size: 18px;
            font-weight: bold;
            color: #333;
        }

        .pesanan-status {
            background: #28a745;
            color: white;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }

        .pesanan-details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 12px;
            padding-bottom: 12px;
            border-bottom: 1px solid #ddd;
        }

        .pesanan-detail {
            font-size: 13px;
        }

        .pesanan-detail-label {
            color: #999;
            margin-bottom: 3px;
        }

        .pesanan-detail-value {
            color: #333;
            font-weight: 600;
        }

        .pesanan-action {
            display: flex;
            gap: 10px;
        }

        .btn-tiket {
            flex: 1;
            background: #667eea;
            color: white;
            padding: 10px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
            font-size: 14px;
        }

        .btn-tiket:hover {
            background: #764ba2;
            transform: translateY(-2px);
        }

        .btn-cetak {
            flex: 1;
            background: #28a745;
            color: white;
            padding: 10px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
            font-size: 14px;
        }

        .btn-cetak:hover {
            background: #218838;
            transform: translateY(-2px);
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #999;
        }

        .empty-icon {
            font-size: 60px;
            margin-bottom: 20px;
        }

        .empty-title {
            font-size: 18px;
            font-weight: bold;
            color: #333;
            margin-bottom: 10px;
        }

        @media (max-width: 600px) {
            .pesanan-card {
                padding: 20px;
            }

            .pesanan-details {
                grid-template-columns: 1fr;
            }

            .pesanan-action {
                flex-direction: column;
            }
        }
    </style>
</head>
<body onload="loadPesanan()">

<!-- NAVBAR -->
<div class="navbar">
    <div class="navbar-left">
        <button class="back-btn" onclick="kembaliKeMenu()">←</button>
        <div class="navbar-title">Pesanan Saya</div>
    </div>
</div>

<!-- PESANAN CONTAINER -->
<div class="pesanan-container">
    <div class="pesanan-card">
        <h2>📋 Daftar Pesanan</h2>
        
        <!-- TAB PESANAN -->
        <div style="display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 2px solid #ddd;">
            <button onclick="filterPesanan('paid')" class="tab-btn active" id="tab-paid" style="flex: 1; padding: 10px; background: none; border: none; border-bottom: 3px solid #667eea; color: #667eea; font-weight: bold; cursor: pointer;">
                ✓ Sudah Dibayar
            </button>
            <button onclick="filterPesanan('unpaid')" class="tab-btn" id="tab-unpaid" style="flex: 1; padding: 10px; background: none; border: none; border-bottom: 3px solid transparent; color: #999; font-weight: bold; cursor: pointer;">
                ⏳ Menunggu Pembayaran
            </button>
            <button onclick="filterPesanan('cancelled')" class="tab-btn" id="tab-cancelled" style="flex: 1; padding: 10px; background: none; border: none; border-bottom: 3px solid transparent; color: #999; font-weight: bold; cursor: pointer;">
                ✗ Dibatalkan
            </button>
        </div>

        <div class="pesanan-list" id="pesanan-list">
            <!-- Pesanan akan di-load di sini -->
        </div>
    </div>
</div>

<script src="../app.js"></script>
<script>
    function loadPesanan() {
        const pesanan = JSON.parse(localStorage.getItem('pesanan')) || [];
        const pesananBayar = pesanan.filter(p => p.status === 'paid');
        const pesananList = document.getElementById('pesanan-list');

        if (pesananBayar.length === 0) {
            pesananList.innerHTML = `
                <div class="empty-state">
                    <div class="empty-icon">📭</div>
                    <div class="empty-title">Belum Ada Pesanan</div>
                    <p>Pesan tiket dan selesaikan pembayaran untuk melihat pesanan Anda di sini.</p>
                </div>
            `;
            return;
        }

        pesananList.innerHTML = pesananBayar.map((p, index) => `
            <div class="pesanan-item" onclick="lihatTiket(${index})">
                <div class="pesanan-header">
                    <div class="pesanan-rute">${p.dari} → ${p.tujuan}</div>
                    <div class="pesanan-status">✓ DIBAYAR</div>
                </div>
                <div class="pesanan-details">
                    <div class="pesanan-detail">
                        <div class="pesanan-detail-label">📅 Tanggal</div>
                        <div class="pesanan-detail-value">${p.tanggal}</div>
                    </div>
                    <div class="pesanan-detail">
                        <div class="pesanan-detail-label">⏰ Jam</div>
                        <div class="pesanan-detail-value">${p.jam_berangkat} - ${p.jam_tiba}</div>
                    </div>
                    <div class="pesanan-detail">
                        <div class="pesanan-detail-label">💺 Kursi</div>
                        <div class="pesanan-detail-value">${p.kursi}</div>
                    </div>
                    <div class="pesanan-detail">
                        <div class="pesanan-detail-label">💰 Total</div>
                        <div class="pesanan-detail-value">Rp ${p.harga_final.toLocaleString('id-ID')}</div>
                    </div>
                </div>
                <div class="pesanan-action">
                    <button class="btn-tiket" onclick="lihatTiket(${index}); event.stopPropagation();">🎫 Lihat Tiket</button>
                    <button class="btn-cetak" onclick="cetakTiket(${index}); event.stopPropagation();">🖨️ Cetak</button>
                </div>
            </div>
        `).join('');
    }

    function lihatTiket(index) {
        const pesanan = JSON.parse(localStorage.getItem('pesanan')) || [];
        const pesananBayar = pesanan.filter(p => p.status === 'paid');
        localStorage.setItem('tiketAktif', JSON.stringify(pesananBayar[index]));
        window.location.href = "tiket-view.html";
    }

    function cetakTiket(index) {
        const pesanan = JSON.parse(localStorage.getItem('pesanan')) || [];
        const pesananBayar = pesanan.filter(p => p.status === 'paid');
        localStorage.setItem('tiketAktif', JSON.stringify(pesananBayar[index]));
        window.print();
    }

    function kembaliKeMenu() {
        window.location.href = "index.html";
    }
</script>
</body>
</html>
