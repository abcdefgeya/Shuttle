<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - AppKita</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body>

<div class="navbar">
    <div class="logo">APPKITA</div>
</div>

<div class="auth-wrapper">
    <div class="card">
        <h2>DAFTAR AKUN</h2>

        <input type="text" id="regUser" placeholder="Username">
        <input type="password" id="regPass" placeholder="Password">

        <button class="btn-main" onclick="register()">DAFTAR SEKARANG</button>

        <div style="margin-top: 20px; color: #777; font-size: 14px;">
            <p>Sudah punya akun?</p>
            <a href="login.html" class="btn-outline">MASUK AKUN</a>
        </div>
    </div>
</div>

<script src="../app.js"></script>
</body>
</html>
